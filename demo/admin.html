<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración · Demo – Galería Viedma</title><link rel="stylesheet" href="demo.css"><script src="demo-common.js"></script></head><body>
<div class="top"><div style="display:flex;align-items:center;gap:10px"><b>Galería Viedma</b><span class="demo">DEMO</span></div><nav><a href="./" class="NAV1">Enmarcá tu obra</a><a href="cart.html" class="NAV2">Carrito <span id="cc"></span></a><a href="admin.html" class="on">Administración</a></nav></div>
<script>document.getElementById("cc").textContent="("+DEMO.cart().length+")"</script>
<div class="wrap"><h1>Administración · Enmarcado Studio</h1><p class="muted">Vista de la galería (demo): los cambios se guardan solo en este navegador y se aplican al estudio al recargarlo.</p>
<div class="card"><h3 style="margin-top:0">Catálogo de marcos</h3><div style="overflow-x:auto"><table><thead><tr><th>Activo</th><th>Nombre</th><th>SKU</th><th>Modelo</th><th>₲ / metro</th><th>Ancho (cm)</th><th>Varilla (cm)</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
<div class="row" style="margin-top:12px"><button class="btn ghost" id="add">＋ Agregar marco</button><button class="btn gold" id="saveF">Guardar catálogo</button><button class="btn ghost" id="resetF">Restaurar ejemplo</button></div></div>
<div class="card"><h3 style="margin-top:0">Precios e IVA</h3><div class="grid2" id="pz"></div><div class="row" style="margin-top:12px"><button class="btn gold" id="saveP">Guardar precios</button></div></div></div>
<script>
var B=[];fetch('builtin.json').then(function(r){return r.json()}).then(function(b){B=b;rows();});var F=DEMO.frames().map(function(f){return Object.assign({},f)});
var fmt=function(n){return Math.round(+n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.')},pm=function(v){return parseInt(String(v).replace(/\D/g,''))||0};
function rows(){var tb=document.getElementById('tb');tb.innerHTML='';F.forEach(function(f,i){var tr=document.createElement('tr');
 tr.innerHTML='<td><input type="checkbox" '+(f.active?'checked':'')+' data-k="active" style="width:auto"></td><td><input data-k="name" value="'+f.name+'"></td><td><input data-k="sku" value="'+(f.sku||'')+'" style="width:90px"></td><td><select data-k="base">'+B.map(function(b){return '<option value="'+b.id+'"'+(b.id===f.base?' selected':'')+'>'+b.name+'</option>'}).join('')+'</select></td><td><input data-k="price" value="'+fmt(f.price)+'" style="width:110px"></td><td><input data-k="width" type="number" step="0.5" value="'+f.width+'" style="width:80px"></td><td><input data-k="rodCm" type="number" value="'+f.rodCm+'" style="width:80px"></td><td><button class="btn ghost" data-del style="padding:6px 10px">✕</button></td>';
 tr.querySelectorAll('[data-k]').forEach(function(e){e.oninput=e.onchange=function(){var k=e.dataset.k;f[k]=k==='active'?e.checked:k==='price'?pm(e.value):(k==='width'||k==='rodCm')?+e.value:e.value;if(k==='price')e.value=fmt(f.price);};});
 tr.querySelector('[data-del]').onclick=function(){F.splice(i,1);rows();};tb.appendChild(tr);});}
document.getElementById('add').onclick=function(){F.push({id:'n'+Date.now(),name:'Nuevo marco',sku:'',base:'liso_negro_satin',price:30000,width:3.5,rodCm:300,active:true});rows();};
document.getElementById('saveF').onclick=function(){DEMO.set('demo_frames',F);alert('Catálogo guardado. Volvé al estudio para verlo.');};
document.getElementById('resetF').onclick=function(){localStorage.removeItem('demo_frames');location.reload();};
var P=DEMO.prices(),FIELDS=[['defaultFramePerM','Moldura genérica ₲/m',1],['wastePct','Desperdicio %'],['passM2','Paspartú ₲/m²',1],['filetePerM','Filete ₲/m',1],['glassBrilloM2','Vidrio brillante ₲/m²',1],['glassMateM2','Vidrio mate ₲/m²',1],['backingM2','Fondo ₲/m²',1],['laborFixed','Mano de obra fija ₲',1],['ivaPct','IVA %'],['plaque.gold','Epígrafe dorado ₲',1],['plaque.silver','Epígrafe plateado ₲',1],['plaque.chromeGold','Epígrafe cromado dorado ₲',1],['plaque.chromeSilver','Epígrafe cromado plateado ₲',1],['rodDefaultCm','Varilla por defecto (cm)']];
var g=function(k){return k.indexOf('.')>0?P.plaque[k.split('.')[1]]:P[k]};
document.getElementById('pz').innerHTML=FIELDS.map(function(f){return '<label>'+f[1]+'<input data-p="'+f[0]+'" data-m="'+(f[2]?1:'')+'" value="'+(f[2]?fmt(g(f[0])):g(f[0]))+'"></label>'}).join('')+'<label>Cobrar moldura por<select id="rm"><option value="m">Metros lineales</option><option value="rod">Varillas completas</option></select></label>';
document.getElementById('rm').value=P.rodMode;document.querySelectorAll('[data-m="1"]').forEach(function(e){e.oninput=function(){e.value=e.value.replace(/\D/g,'')?fmt(pm(e.value)):''}});
document.getElementById('saveP').onclick=function(){document.querySelectorAll('[data-p]').forEach(function(e){var k=e.dataset.p,v=e.dataset.m?pm(e.value):parseFloat(String(e.value).replace(',','.'))||0;if(k.indexOf('.')>0)P.plaque[k.split('.')[1]]=v;else P[k]=v;});P.rodMode=document.getElementById('rm').value;DEMO.set('demo_prices',P);alert('Precios guardados.');};
</script></body></html>
